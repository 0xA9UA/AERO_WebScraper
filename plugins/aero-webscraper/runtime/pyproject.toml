# MMA FILE SUMMARY
# Purpose: Declares build, dependency, command, and test configuration.
# Public interface: aero-webscraper CLI; pip install .[pdf,test].
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aero-webscraper-suite"
version = "0.1.0"
description = "Permission-gated, provenance-preserving reference library and seed crawler"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.10,<3", "filelock>=3.16,<4", "PyYAML>=6,<7"]

[project.optional-dependencies]
pdf = ["pypdf>=5.9,<7"]
test = ["pytest>=8,<10", "jsonschema>=4.20,<5", "reportlab>=4,<5"]

[project.scripts]
aero-webscraper = "aero_webscraper.adapters.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aero_webscraper = ["catalog/*.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]